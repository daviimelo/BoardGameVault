<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Jogo - BoardGame Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">

    <div class="d-flex vh-100 flex-column">
        <nav class="navbar px-4 py-3" style="background-color: var(--bg-dark) !important; border-bottom: 1px solid var(--border-color);">
            <div class="container-fluid">
                <a href="../home/index.html" class="text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-chevron-left fs-5"></i>
                </a>
                <div class="brand d-flex align-items-center gap-2">
                    <i class="bi bi-box-seam-fill fs-5" style="color: var(--primary);"></i>
                    <span class="fw-bold d-none d-md-block" style="background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">BoardGame Vault</span>
                </div>
            </div>
        </nav>

        <main class="flex-grow-1 overflow-auto p-4 p-md-5">
            <div class="container" style="max-width: 900px;">
                
                <!-- Loaading -->
                <div id="loading-container" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3 text-secondary fw-bold" style="letter-spacing: 1px;">CARREGANDO DETALHES...</p>
                </div>

                <!-- Conteudo -->
                <div id="detalhes-container" class="d-none animate-enter">
                    
                    <!-- Header -->
                    <header class="mb-5">
                        <div class="d-flex justify-content-between align-items-start gap-3 flex-column flex-md-row">
                            <div class="flex-grow-1">
                                <p id="detail-category">Categoria</p>
                                <h1 id="detail-name">Nome do Jogo</h1>
                            </div>
                            <span id="detail-status" class="badge">Status</span>
                        </div>
                    </header>

                    <div class="row g-4">
                        <!-- Informações Técnicas -->
                        <div class="col-md-6">
                            <div class="detail-card h-100">
                                <h5>
                                    <i class="bi bi-info-circle"></i>
                                    Informações Técnicas
                                </h5>
                                <div>
                                    <div>
                                        <p>Número de Jogadores</p>
                                        <p class="fs-5"><i class="bi bi-people-fill"></i> <span id="detail-players">-</span></p>
                                    </div>
                                    <div>
                                        <p>Tempo de Partida</p>
                                        <p class="fs-5"><i class="bi bi-stopwatch"></i> <span id="detail-time">-</span> min</p>
                                    </div>
                                    <div>
                                        <p>Adicionado em</p>
                                        <p class="fs-6"><span id="detail-date">-</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Observações -->
                        <div class="col-md-6">
                            <div class="detail-card h-100">
                                <h5>
                                    <i class="bi bi-journal-text"></i>
                                    Suas Observações
                                </h5>
                                <div style="flex: 1; display: flex; align-items: center;">
                                    <div class="notes-container w-100">
                                        <p id="detail-notes" class="fst-italic">Nenhuma observação registrada para este jogo.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script type="module" src="games.js"></script>
</body>
</html>
