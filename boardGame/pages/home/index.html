<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>BoardGame Vault - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-white">

    <div class="d-flex vh-100">

        <aside class="sidebar p-4 d-flex flex-column"
            style="width: 250px; background-color: #0a0b10; border-right: 1px solid rgba(255,255,255,0.05);">
            <div class="brand mb-5 d-flex align-items-center gap-3">
                <i class="bi bi-box-seam-fill start-card-icon fs-4"></i>
                <span class="fw-bold fs-5">BoardGame<br>Vault</span>
            </div>

            <p class="text-uppercase text-secondary" style="font-size: 0.75rem;">Navegação</p>
            <nav class="nav flex-column mb-auto">
                <a class="nav-link text-white bg-primary bg-opacity-10 rounded d-flex align-items-center gap-2"
                    href="#">
                    <i class="bi bi-grid-1x2-fill"></i> Minha coleção
                </a>
            </nav>

            <div class="mt-auto">
                <button id="btn-logout"
                    class="btn btn-link text-danger text-decoration-none p-0 d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left"></i> Sair
                </button>
            </div>
        </aside>

        <main class="flex-grow-1 p-5 overflow-auto" style="background-color: #13141c;">

            <header class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <p class="text-uppercase text-primary fw-bold mb-1" style="font-size: 0.8rem;">Minha Coleção</p>
                    <h2 class="fw-bold"><span id="saudacao-nome">Olá, Jogador</span>. Sua estante hoje.</h2>
                </div>
                <button class="btn btn-primary fw-bold px-4 rounded-pill" data-bs-toggle="modal"
                    data-bs-target="#modalNovoJogo">
                    <i class="bi bi-plus-lg me-1"></i> Novo jogo
                </button>
            </header>

            <div class="row mb-5 g-3" id="stats-container">
            </div>

            <div class="filtro-wrapper mb-5">
                <div class="p-4 rounded-4"
                    style="background: linear-gradient(135deg, #1a1b26 0%, rgba(26, 27, 38, 0.5) 100%); border: 1px solid rgba(255,255,255,0.08);">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <i class="bi bi-search text-primary fs-5"></i>
                        <h6 class="mb-0 fw-bold text-uppercase"
                            style="color: #a0a0a8; letter-spacing: 1px; font-size: 0.8rem;">Filtrar Coleção</h6>
                    </div>

                    <form id="form-busca" class="row g-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control custom-input py-2" id="search-name" placeholder="Nome do jogo (ex: Catan)">
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control custom-input py-2" id="search-category" placeholder="Categoria (ex: Estratégia)">
                        </div>
                        <div class="col-md-4">
                            <select class="form-select custom-input py-2 text-secondary" id="search-status">
                                <option value="">Qualquer status</option>
                                <option value="quero jogar">Quero jogar</option>
                                <option value="jogando">Jogando</option>
                                <option value="zerado">Zerado</option>
                                <option value="vendido">Vendido</option>
                                <option value="emprestado">Emprestado</option>
                            </select>
                        </div>
                        
                        <div class="col-md-3">
                            <input type="text" class="form-control custom-input py-2" id="search-players" placeholder="Nº Jogadores (Ex: 1-4)">
                        </div>
                        <div class="col-md-3">
                            <input type="number" class="form-control custom-input py-2" id="search-playTime" placeholder="Tempo em min (Ex: 60)">
                        </div>
                        <div class="col-md-6 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1 fw-bold py-2">
                                <i class="bi bi-funnel-fill me-1"></i> Filtrar
                            </button>
                            <button type="button" id="btn-limpar-busca" class="btn btn-outline-secondary py-2 px-3" title="Limpar Filtros">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="games-grid" id="games-container">
                <div class="col-12 text-center mt-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="text-secondary mt-3">Carregando seus jogos...</p>
                </div>
            </div>

        </main>
    </div>

    <div class="modal fade" id="modalNovoJogo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white"
                style="background-color: #1a1b26; border: 1px solid rgba(255,255,255,0.1);">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Adicionar novo jogo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="form-novo-jogo">
                        <div class="mb-3">
                            <label class="form-label text-secondary small">Nome do Jogo *</label>
                            <input type="text" class="form-control custom-input bg-dark text-white border-secondary"
                                id="game-name" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary small">Categoria *</label>
                                <input type="text" class="form-control custom-input bg-dark text-white border-secondary"
                                    id="game-category" placeholder="Ex: Estratégia" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary small">Status *</label>
                                <select class="form-select custom-input bg-dark text-white border-secondary"
                                    id="game-status" required>
                                    <option value="quero jogar">Quero jogar</option>
                                    <option value="jogando" selected>Jogando</option>
                                    <option value="zerado">Zerado</option>
                                    <option value="vendido">Vendido</option>
                                    <option value="emprestado">Emprestado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-secondary small">Nº de Jogadores *</label>
                                <input type="text" class="form-control custom-input bg-dark text-white border-secondary"
                                    id="game-players" placeholder="Ex: 1-4" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-secondary small">Tempo Médio (min)</label>
                                <input type="number"
                                    class="form-control custom-input bg-dark text-white border-secondary" id="game-time"
                                    placeholder="Ex: 120">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Observações</label>
                            <textarea class="form-control custom-input bg-dark text-white border-secondary"
                                id="game-notes" rows="2" placeholder="Opcional..."></textarea>
                        </div>

                        <div id="modal-mensagem" class="mt-2"></div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="form-novo-jogo" class="btn btn-primary">Salvar Jogo</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="home.js"></script>
</body>

</html>
